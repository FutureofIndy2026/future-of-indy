
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Patrick McAuley for U.S. Congress</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101a2a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      min-height: calc(100vh - 65px);
    }

    .message {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6vw;
    }

    h1 {
      font-size: clamp(2.3rem, 4.1vw, 4.75rem);
      line-height: 1.09;
      margin-bottom: 30px;
    }

    h1 strong {
      color: #ff6962;
    }

    p {
      font-size: clamp(1.12rem, 1.65vw, 1.55rem);
      line-height: 1.5;
      color: #e5e9f1;
    }

    .vote {
      font-weight: 800;
      color: white;
      font-size: 1.8rem;
    }

    .slogan {
      font-weight: 900;
      text-transform: uppercase;
      color: #ff6962;
      font-size: 2.4rem;
    }

    .photo {
      position: relative;
      min-height: 610px;
      overflow: hidden;
    }

    .photo img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 19%;
    }

    footer {
      background: #0b1220;
      text-align: center;
      padding: 12px;
    }

    .disclaimer {
      display: inline-block;
      border: 2px solid white;
      color: white;
      padding: 7px 13px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    @media (max-width: 780px) {
      main {
        display: flex;
        flex-direction: column-reverse;
      }

      .photo {
        height: 47vh;
        min-height: 310px;
      }

      .message {
        padding: 45px 26px;
      }

      h1 {
        font-size: 2.3rem;
      }

      .vote {
        font-size: 1.4rem;
      }

      .slogan {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="message">
      <h1>
        André Carson has
        <strong>destroyed our communities.</strong>
      </h1>

      <p>
        It's time for focused, determined,
        hands-on and consistent energetic leadership.
      </p>

      <p class="vote">
        Vote Patrick McAuley for U.S. Congress
        now until November 3rd.
      </p>

      <p class="slogan">The time is now.</p>
    </section>

    <div class="headshot">
      <img src="patrick-headshot.png"
           alt="Patrick McAuley with American flag">
    </div>
  </main>

  <footer>
    <span class="disclaimer">
      Paid for by Future of Indy
    </span>
  </footer>
</body>
</html>
